<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="청아노무법인 사내용 노동 기준금액·요율 조회, 계산기, 고용지원금 적용 검토">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a4c8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="청아노무법인">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>청아노무법인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 모바일 우선 단일 컬럼 도구, 상단 기준일 바 + 하단 탭 바, 데스크톱에서는 중앙 760px 컬럼 */
:root{
  /* 청색 투톤: 짙은 남청(헤더·강조) + 밝은 청(포인트), 연청 바탕 */
  --paper:#eaf1f9; --surface:#ffffff; --sunk:#e1eaf5; --ink:#13233a; --muted:#56687f; --line:#ccd9e8;
  --accent:#12396e; --accent-2:#2c7be5; --accent-soft:#dbe8f8; --seal:#c0392b; --seal-soft:#f9e3e0;
  --hdr:#1a4c8c; --hdr-2:#1a4c8c; --hdr-fg:#ffffff;
  --ok:#1f7a4d; --ok-soft:#dcf0e5; --warn:#a0660a; --warn-soft:#f7ecd7; --no:#76839a; --no-soft:#e6ebf2;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0a1322; --surface:#111d31; --sunk:#0d182a; --ink:#e2eaf5; --muted:#93a6c0; --line:#22344f;
  --accent:#8fbaf0; --accent-2:#4d9bf0; --accent-soft:#16294a; --seal:#ef7468; --seal-soft:#3a1d1d;
  --hdr:#173f75; --hdr-2:#173f75; --hdr-fg:#ffffff;
  --ok:#62c48f; --ok-soft:#123222; --warn:#e6ae55; --warn-soft:#342812; --no:#8a9ab0; --no-soft:#1a263a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0a1322; --surface:#111d31; --sunk:#0d182a; --ink:#e2eaf5; --muted:#93a6c0; --line:#22344f;
  --accent:#8fbaf0; --accent-2:#4d9bf0; --accent-soft:#16294a; --seal:#ef7468; --seal-soft:#3a1d1d;
  --hdr:#173f75; --hdr-2:#173f75; --hdr-fg:#ffffff;
  --ok:#62c48f; --ok-soft:#123222; --warn:#e6ae55; --warn-soft:#342812; --no:#8a9ab0; --no-soft:#1a263a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
a{color:var(--accent)}

/* 상단 바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdr-fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px}
.top-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px 16px}
.ctl{display:grid;justify-items:end;align-content:center;gap:6px}
@media (max-width:560px){.top-in{grid-template-columns:minmax(0,1fr)}.ctl{grid-template-columns:minmax(0,1fr);justify-items:start}.asof-note{justify-self:start}}
.asof button{white-space:nowrap}
.brand{font-family:var(--f-display);font-size:32px;letter-spacing:.04em;margin:0;line-height:1.2}
.brand small{display:block;font-family:var(--f-body);font-size:18px;font-weight:500;opacity:.9;letter-spacing:.02em;margin-top:4px}
.asof{display:flex;align-items:center;gap:6px;font-size:12px}
.asof input{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 8px;color:inherit;font-family:var(--f-num);font-size:13px}
.asof select{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 6px;color:inherit;font-size:13px;font-family:var(--f-num)}
.asof select option{color:#13233a;background:#fff}
.asof .nav-m{padding:4px 6px;display:inline-grid;place-items:center}
.asof .nav-m:disabled{opacity:.35;cursor:default}
.asof .nav-m svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.asof #today[aria-pressed="true"]{background:#fff;color:var(--hdr);font-weight:700}
.asof-note{text-align:right;white-space:nowrap;font-size:11px;opacity:.85;font-family:var(--f-num);justify-self:end}
.asof button{background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 8px;color:inherit;font-size:12px;cursor:pointer}

main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
.view{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.view>*{min-width:0}
#res,#all{grid-template-columns:minmax(0,1fr)}
h2{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0;font-weight:600}
.lede{color:var(--muted);font-size:13px;margin:4px 0 0}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* 요약 수치 */
.figs{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:620px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fgrp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;min-width:0;align-content:start}
.fgrp h3{font-size:13px;color:var(--accent);margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fgrp h3 small{font-weight:500;color:var(--muted);font-size:11px}
.frow{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;background:none;border:0;border-top:1px dashed var(--line);padding:8px 0 6px;text-align:left;cursor:pointer;width:100%}
.frow:first-of-type{border-top:0}
.frow .k{font-size:13px;color:var(--muted);white-space:nowrap}
.frow .v{justify-self:end;color:var(--accent);font-family:var(--f-num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.frow .s{grid-column:1/-1;justify-self:end;font-size:11px;color:var(--muted);text-align:right}
.frow .nx{color:var(--seal);font-weight:600}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:2px;min-width:0;cursor:pointer;text-align:left}
.fig .k{font-size:12px;color:var(--muted)}
.fig .v{color:var(--accent);font-family:var(--f-num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;word-break:keep-all}
.fig .s{font-size:11px;color:var(--muted)}
.fig .nx{font-size:11px;color:var(--seal);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panel>h3:first-child{color:var(--accent)}
h2{color:var(--accent)}
.list{display:grid;gap:0}
.row{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.date{font-family:var(--f-num);font-size:12px;color:var(--seal);font-weight:600;white-space:nowrap;padding-top:2px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.p-now{background:var(--accent-soft);color:var(--accent)}
.p-next{background:var(--seal-soft);color:var(--seal)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-no{background:var(--no-soft);color:var(--no)}

/* 계산기 */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form .full{grid-column:1/-1}
@media (max-width:420px){.form{grid-template-columns:1fr}}
.f{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0;align-content:start}
.lab{display:flex;align-items:center;gap:6px;justify-content:space-between}
.lab label{min-width:0}
.q{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--accent-2);background:var(--surface);color:var(--accent-2);font-size:12px;font-weight:700;line-height:1;cursor:pointer;display:inline-grid;place-items:center;padding:0}
.q[aria-expanded="true"]{background:var(--accent-2);color:#fff;border-color:var(--accent-2)}
.help{font-size:12px;line-height:1.55;color:var(--ink);background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.chkrow{display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13px}
.steps li b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.formula{font-family:var(--f-num);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
.rule{display:grid;gap:6px;font-size:13px}
.rule details{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.rule summary{cursor:pointer;padding:10px 12px;font-weight:600}
.rule .rb{padding:0 12px 12px;display:grid;gap:8px}
.rule ol,.rule ul{margin:0;padding-left:20px;display:grid;gap:6px}
.jn{font-family:var(--f-num);color:var(--accent);font-weight:600;margin-right:4px}
.f input,.f select{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;width:100%;min-width:0}
.f input[type=number],.f input.money{font-family:var(--f-num)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink)}
.chk input{margin-top:5px;accent-color:var(--accent)}
.result{background:var(--sunk);border-radius:8px;padding:12px;display:grid;gap:6px}
.big{font-family:var(--f-num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted)}
.note b{color:var(--ink)}
.basis{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}

/* 표 */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--sunk);font-weight:600;font-size:12px;color:var(--muted)}
td.n{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}

/* 지원금 */
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.gcard>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;gap:4px}
.gcard>summary::-webkit-details-marker{display:none}
.ghead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gname{font-weight:600;font-size:15px}
.gamt{font-size:13px;color:var(--muted)}
.gbody{padding:0 16px 16px;display:grid;gap:10px}
.gbody dl{margin:0;display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:13px}
.gbody dt{color:var(--muted)}
.gbody dd{margin:0;min-width:0}
.why{font-size:12px;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.why li{margin:2px 0}
.why ul{margin:0;padding-left:18px}

.search{display:flex;gap:8px;position:relative}
.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
.search input{padding-left:38px!important;font-size:16px;border:2px solid var(--accent-2)!important;border-radius:12px!important}
.kw{display:flex;gap:6px;flex-wrap:wrap}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;text-align:left;cursor:pointer;width:100%;min-width:0}
.hit:hover{border-color:var(--accent-2)}
.hit .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hit .tt{font-weight:600}
.hit .sn{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.hit .val{font-family:var(--f-num);font-weight:600;color:var(--accent);white-space:nowrap}
mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px}
.p-type{background:var(--accent-soft);color:var(--accent)}
.osec{display:grid;gap:4px;padding:10px 0;border-top:1px dashed var(--line)}
.osec:first-child{border-top:0;padding-top:0}
.oh{font-size:12px;font-weight:700;color:var(--accent)}
.ot{font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
details.more>summary{cursor:pointer;color:var(--accent-2);font-size:13px;padding:10px 0;border-top:1px solid var(--line)}
.hitdetail{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px}

.item{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:4px}
.item:first-child{border-top:0}
.item .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.item .val{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.item .meta{font-size:11px;color:var(--muted);word-break:break-all}
.hist{font-size:12px;color:var(--muted)}

/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 9px;font-size:12px;color:var(--muted);cursor:pointer;display:grid;justify-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav.tabs button[aria-current="page"]{color:var(--accent-2);font-weight:600;box-shadow:inset 0 3px 0 var(--accent-2)}
.err{padding:16px;border-radius:8px;background:var(--seal-soft);color:var(--seal)}
.foot{font-size:11px;color:var(--muted);text-align:center;padding-top:8px}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>
<style>
/* 단독 실행용 기본 설정 */
:root{color-scheme:light}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.install{display:grid;gap:8px}
.install .btnlink{justify-self:start;background:var(--accent);color:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;text-decoration:none}
.install button{justify-self:start;background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
/* 하단 법인 소개 */
.firm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 16px 18px;display:grid;gap:14px;text-align:center}
.firm-bar{width:28px;height:3px;background:var(--accent-2);margin:0 auto 2px;border-radius:2px}
.firm-lead{margin:0;font-size:15px;color:var(--muted)}
.firm-lead b{color:var(--accent);font-size:16px}
.firm-sub{margin:0;font-size:13px;color:var(--muted);line-height:1.7}
.firm-sub b{color:var(--ink)}
.svc{margin:0;background:var(--sunk);border-radius:10px;padding:6px 14px;text-align:left}
.svc>div{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line);font-size:12.5px}
.svc>div:first-child{border-top:0}
.svc dt{font-weight:700;color:var(--accent)}
.svc dd{margin:0;color:var(--muted);min-width:0}
.office{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.o-main{min-width:0}
.o-who{font-size:13px;color:var(--muted)}
.o-who b{color:var(--accent);font-size:14px}
.o-who .o-name{color:var(--ink);white-space:nowrap}
.o-who{word-break:keep-all}
.o-tel{font-family:var(--f-num);font-weight:700;font-size:17px;color:var(--ink);letter-spacing:.02em;margin-top:2px}
.o-addr{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45;word-break:keep-all}
.o-call{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--hdr);color:#fff;text-decoration:none;font-size:13px;font-weight:700;border-radius:999px;padding:9px 14px}
.o-call svg{width:14px;height:14px;fill:currentColor}
.firm-foot{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:2px}
.ff-name{font-family:var(--f-display);font-size:18px;color:var(--accent)}
.ff-sub{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.disc{margin-top:10px;text-align:left;font-size:11.5px;color:var(--muted)}
.disc summary{cursor:pointer;text-align:center;font-weight:600;color:var(--muted);font-size:12px;padding:4px 0}
.disc ol{margin:8px 0 0;padding-left:18px;display:grid;gap:6px;line-height:1.6}
.ff-note{font-size:10.5px;color:var(--muted);opacity:.8;margin-top:8px;line-height:1.6}
</style>
</head>
<body>


<header class="top">
  <div class="top-in">
    <h1 class="brand">청아노무법인<small>사람과 기업을 소중히 하는 마음</small></h1>
    <div class="ctl">
    <div class="asof">
      <button type="button" class="nav-m" id="mprev" aria-label="이전 달"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button>
      <select id="month" aria-label="조회 월"></select>
      <button type="button" class="nav-m" id="mnext" aria-label="다음 달"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
      <button type="button" id="today" aria-pressed="true">오늘</button>
    </div>
    <div class="asof-note" id="asofNote"></div>
    </div>
  </div>
</header>

<script>
(function(){
"use strict";
let D=null, ASOF=todayStr(), TAB="summary", CALC="mw", GFILTER="all", GOPEN=null;
const $=s=>document.querySelector(s);
const app=$("#app");
function todayStr(){const d=new Date(Date.now()+9*3600e3);return d.toISOString().slice(0,10);}
const won=n=>(n==null||isNaN(n))?"-":Math.round(n).toLocaleString("ko-KR")+"원";
const fmt=n=>(n==null||isNaN(n))?"-":Number(n).toLocaleString("ko-KR",{maximumFractionDigits:4});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem("cn."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("cn."+k,JSON.stringify(v))}catch(e){}}};

/* 기준 데이터 해석: 조회 기준일 이전 최신 값이 현행, 이후 값은 예정 */
function entry(id,date){const it=D.items[id];if(!it)return null;const h=[...it.hist].sort((a,b)=>a.from<b.from?-1:1);let cur=null;for(const e of h){if(e.from<=(date||ASOF))cur=e;}return cur;}
function nextEntry(id){const it=D.items[id];if(!it)return null;return [...it.hist].sort((a,b)=>a.from<b.from?-1:1).find(e=>e.from>ASOF)||null;}
function v(id){const e=entry(id);return e?e.value:null;}
function tbl(id){const t=D.tables[id];if(!t)return null;const vs=[...t.versions].sort((a,b)=>a.from<b.from?-1:1);let cur=null;for(const x of vs){if(x.from<=ASOF)cur=x;}return cur;}
function showVal(it,e){if(!e)return"-";if(typeof e.value==="number"){return it.unit==="원"?won(e.value):fmt(e.value)+(it.unit?(it.unit==="%"?"%":" "+it.unit):"");}return esc(e.value);}
/* 출처 허용 범위: 법제처, 정책브리핑, 고용노동부, 그 밖의 공공기관. 언론·민간 사이트 링크는 표시하지 않음 */
const OK_SRC=/^https?:\/\/([a-z0-9-]+\.)*(law\.go\.kr|lawmaking\.go\.kr|korea\.kr|moel\.go\.kr|work24\.go\.kr|ei\.go\.kr|comwel\.or\.kr|nhis\.or\.kr|nps\.or\.kr|kead\.or\.kr|bokjiro\.go\.kr|mohw\.go\.kr|minimumwage\.go\.kr|assembly\.go\.kr|4insure\.or\.kr|kosha\.or\.kr)([\/?#]|$)/i;
function okSrc(u){return OK_SRC.test(String(u||""));}
function noticeRow(n){return `<div class="row"><span class="date">${esc(n.date)}</span><div>${esc(n.text)}${okSrc(n.src)?` <a href="${esc(n.src)}" target="_blank" rel="noopener">${srcLabel(n.src)}</a>`:""}</div></div>`;}
function srcLabel(u){u=String(u||"");return /lawmaking\.go\.kr/.test(u)?"입법예고":/law\.go\.kr\/(행정규칙|%ED%96%89%EC%A0%95%EA%B7%9C%EC%B9%99)/i.test(u)?"고시 원문":/law\.go\.kr\/(법령별표서식|%EB%B2%95%EB%A0%B9%EB%B3%84%ED%91%9C)/i.test(u)?"별표 원문":/law\.go\.kr/.test(u)?"법령 원문":/likms\.assembly|assembly\.go\.kr/.test(u)?"국회 의안":/moel\.go\.kr/.test(u)?"고용노동부":/korea\.kr/.test(u)?"정책브리핑":"출처";}
function srcLine(ids){const out=[];for(const id of ids){const it=D.items[id],e=entry(id);if(!it||!e)continue;out.push(`${esc(it.name)}: ${esc(e.basis||"")}${okSrc(e.src)?` <a href="${esc(e.src)}" target="_blank" rel="noopener">출처</a>`:""} (확인 ${esc(e.checked||"")})`);}return out.length?`<div class="basis">※ 적용 기준(${esc(ASOF)}): ${out.join(" / ")}</div>`:"";}

/* 탭 */
/* 뒤로가기: 요약 외 탭에서 휴대폰 뒤로가기를 누르면 요약으로 돌아감 */
function showTab(t){TAB=t;document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===t?"page":"false"));render();window.scrollTo(0,0);}
function setTab(t){const from=TAB;try{if(t!=="summary"&&from==="summary")history.pushState({tab:t},"","#"+t);else if(t==="summary"&&from!=="summary"&&history.state&&history.state.tab){history.back();return;}else history.replaceState({tab:t},"","#"+t);}catch(e){}showTab(t);}
window.addEventListener("popstate",e=>{const t=(e.state&&e.state.tab)||"summary";if(t!==TAB)showTab(t);});
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
/* 조회 기준: 월 단위 선택(해당 월 1일 기준), 오늘 버튼은 현 시점 기준으로 데이터를 다시 불러옴 */
let MODE="today";
/* 조회 가능 시점: 과거는 2024·2025·2026년 1월, 그리고 현재 월. 미래 월은 두지 않음 */
const PAST_POINTS=["2024-01","2025-01","2026-01"],FUTURE_POINTS=["2027-01"];
function curYM(){return todayStr().slice(0,7);}
function monthOpts(){const c=curYM();return [...new Set([...PAST_POINTS.filter(v=>v<c),c,...FUTURE_POINTS.filter(v=>v>c)])];}
function isPast(){return MODE==="month"&&ASOF.slice(0,7)<curYM();}
function isFuture(){return MODE==="month"&&ASOF.slice(0,7)>curYM();}
function asofText(){return MODE==="today"?ASOF+" 현재":ASOF.slice(0,4)+"년 "+(+ASOF.slice(5,7))+"월 1일";}
function syncHeader(){const ym=ASOF.slice(0,7);const sel=$("#month");sel.value=MODE==="today"?curYM():ym;$("#mprev").disabled=sel.selectedIndex<=0;$("#mnext").disabled=sel.selectedIndex>=sel.options.length-1;
  $("#today").setAttribute("aria-pressed",MODE==="today"?"true":"false");$("#asofNote").textContent=MODE==="today"?"오늘("+ASOF+") 기준":ym.slice(0,4)+"년 "+(+ym.slice(5))+"월 1일 기준";}
function setMonth(ym){if(ym===curYM()){MODE="today";ASOF=todayStr();}else{MODE="month";ASOF=ym+"-01";}syncHeader();render();}
function shiftMonth(n){const o=monthOpts();let i=o.indexOf(MODE==="today"?curYM():ASOF.slice(0,7));if(i<0)i=o.length-1;i=Math.max(0,Math.min(o.length-1,i+n));setMonth(o[i]);}
let IV=null;
function loadInterp(){return fetch("interp.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.items))IV=j;}).catch(()=>{});}
function loadData(){return Promise.all([fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(j=>{D=j;}),loadInterp()]);}
$("#month").innerHTML=monthOpts().map(v=>`<option value="${v}">${v.slice(0,4)}년 ${+v.slice(5)}월${v===curYM()?" (현재)":v>curYM()?" (예정)":""}</option>`).join("");
$("#month").addEventListener("change",e=>setMonth(e.target.value));
$("#mprev").addEventListener("click",()=>shiftMonth(-1));
$("#mnext").addEventListener("click",()=>shiftMonth(1));
$("#today").addEventListener("click",()=>{MODE="today";ASOF=todayStr();syncHeader();const b=$("#today");b.textContent="갱신 중";
  loadData().then(()=>{render();b.textContent="오늘";}).catch(e=>{b.textContent="오늘";render();});});

function render(){if(!D)return;({summary:rSummary,calc:rCalc,grants:rGrants,interp:rInterp,search:rSearch,table:rSearch}[TAB]||rSummary)();}

/* ---------- 요약 ---------- */
function rSummary(){
  const GROUPS=[{t:"최저임금",sub:"",rows:[["min_wage_hourly","시간급"],["min_wage_monthly","월 환산(209시간)"]]},
    {t:"사회보험요율",sub:"근로자·사업주 합계",rows:[["np_rate","국민연금"],["hi_rate","건강보험"],["ltc_rate","장기요양(소득 대비)"]]},
    {t:"국민연금 기준소득월액",sub:"매년 7월 조정",rows:[["np_lower","하한"],["np_upper","상한"]]},
    {t:"산재 보상기준 1일",sub:"",rows:[["ia_min","최저보상기준"],["ia_max","최고보상기준"]]}];
  const figs=GROUPS.map(g=>`<div class="fgrp"><h3>${esc(g.t)}${g.sub?`<small>${esc(g.sub)}</small>`:""}</h3>${g.rows.map(([id,lab])=>{const it=D.items[id];if(!it)return"";const e=entry(id),n=nextEntry(id);
    return `<button type="button" class="frow" data-go="${esc(id)}"><span class="k">${esc(lab)}</span><span class="v">${showVal(it,e)}</span>
    <span class="s">${e&&/자동 반영/.test(e.note||"")&&e.checked&&(new Date(todayStr())-new Date(e.checked))/864e5<=7?`<span class="pill p-warn">자동 반영 ${esc(e.checked.slice(5))}</span> `:""}${e?(isFuture()&&e.from<ASOF?esc(e.from)+" 시행 값(이후 변경 미확정)":esc(e.from)+" 시행"):"해당 시점 자료 없음"}${n&&!isPast()&&!isFuture()?` · <span class="nx">${esc(n.from)}부터 ${showVal(it,n)}</span>`:""}</span></button>`}).join("")}</div>`).join("");
  const TODAY=todayStr();
  const dayBefore=d=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()-1);return x.toISOString().slice(0,10);};
  const ST={"확정":"p-ok","입법예고":"p-warn","국회 계류":"p-no","정부안":"p-no","예산안":"p-no"};
  /* 변경 목록: 기준 수치 이력(확정) + 예정 사항(scheduled) */
  function changeList(from,to){const out=[];
    for(const [id,it] of Object.entries(D.items)){for(const e of it.hist){if(e.from>from&&e.from<=to){const pv=entry(id,dayBefore(e.from));
      out.push({date:e.from,title:it.name,before:pv?showVal(it,pv):"-",after:showVal(it,e),status:"확정",note:e.note||"",basis:e.basis||"",src:e.src||"",item:id});}}}
    for(const c of (D.scheduled||[])){if(c.from>from&&c.from<=to)out.push({date:c.from,title:c.title,before:esc(c.before||""),after:esc(c.after||""),status:c.status||"",note:c.note||"",basis:c.basis||"",src:c.src||""});}
    return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.status==="확정"?-1:1));}
  function changeRows(list){return list.map(x=>`<div class="row"><span class="date">${esc(x.date)}</span><div><div class="ghead"><b>${esc(x.title)}</b><span class="pill ${ST[x.status]||"p-no"}">${esc(x.status)}</span></div>
    ${x.before||x.after?(x.before&&x.before===x.after?`<div>변동 없음(<b>${x.after}</b> 유지)</div>`:`<div>${x.before&&x.before!=="-"?`<span class="note">이전</span> ${x.before} · `:""}<span class="note">변경</span> <b>${x.after}</b></div>`):""}${x.note?`<div class="note">※ ${esc(x.note)}</div>`:""}
    ${x.basis||x.src?`<div class="note">${esc(x.basis)}${okSrc(x.src)?` <a href="${esc(x.src)}" target="_blank" rel="noopener">${srcLabel(x.src)}</a>`:""}</div>`:""}</div></div>`).join("");}
  const upcoming=changeList(TODAY,"9999-12-31");
  const atPoint=isFuture()?changeList(TODAY,ASOF):[];
  const d120=new Date(new Date(ASOF+"T00:00:00Z").getTime()-120*864e5).toISOString().slice(0,10);
  const recent=changeList(dayBefore(d120),ASOF).filter(x=>x.status==="확정").reverse();
  app.innerHTML=`<section class="view">
  <div><span class="eyebrow">${esc(asofText())} 기준 현행</span><h2>주요 기준금액과 요율</h2><p class="lede">수치를 누르면 근거와 변경 이력을 볼 수 있습니다. 조회 월을 바꾸면 그달 1일에 시행 중인 값으로, 오늘을 누르면 현 시점 최신 데이터로 다시 불러옵니다.</p></div>
  <div class="figs">${figs}</div>
  ${!isPast()&&!isFuture()&&recent.length?`<div class="panel"><div class="ghead"><h3>최근 120일 내 시행된 변경</h3><span class="pill p-ok">${recent.length}건</span></div><div class="list">${changeRows(recent)}</div></div>`:""}
  ${isFuture()?`<div class="panel"><div class="ghead"><h3>${esc(asofText())}까지 바뀌는 주요 내용</h3><span class="pill p-next">${atPoint.length}건</span></div>
    <p class="note">오늘(${esc(TODAY)}) 이후 ${esc(asofText())}까지 시행되거나 추진 중인 변경입니다. <b>확정</b>은 공포·고시된 사항, <b>입법예고·국회 계류·정부안·예산안</b>은 아직 바뀔 수 있는 사항입니다. "이후 변경 미확정"으로 표시된 수치는 해당 연도 고시 전이라 현행 값을 보여 줍니다.</p>
    <div class="list">${atPoint.length?changeRows(atPoint):`<p class="note">해당 기간에 예정된 변경이 없습니다.</p>`}</div></div>`
   :isPast()?`<div class="panel"><h3>과거 시점 조회 중</h3><p class="note">${esc(asofText())}에 시행 중이던 기준입니다. 이후 변경 이력은 검색 탭의 각 항목에서 확인할 수 있으며, 오늘을 누르면 현재 기준으로 돌아갑니다.</p></div>`
   :`<div class="panel"><div class="ghead"><h3>시행 예정 변경</h3><span class="pill p-next">${upcoming.length}건</span></div>
    <div class="list">${upcoming.length?changeRows(upcoming):`<p class="note">기준일 이후 예정된 변경이 없습니다.</p>`}</div></div>`}
  ${!isPast()&&(D.notices||[]).length?`<div class="panel"><h3>입법·제도 동향 메모</h3><div class="list">${[...D.notices].sort((a,b)=>Math.abs(new Date(a.date)-new Date(TODAY))-Math.abs(new Date(b.date)-new Date(TODAY))).map((n,ix)=>ix===8?`<details class="more"><summary>이전 동향 ${D.notices.length-8}건 더 보기</summary>`+noticeRow(n):noticeRow(n)).join("")+(D.notices.length>8?"</details>":"")}</div></div>`:""}
  ${installPanel()}
  <section class="firm">
   <div class="firm-bar"></div>
   <p class="firm-lead">어렵고 복잡한 노동문제 <b>청아노무법인</b>과 함께 하세요</p>
   <p class="firm-sub"><b>20년 이상 실무경력</b>을 갖춘 최고의 전문가들이<br>축적된 <b>노하우(Know-how)</b>로 <b>현장 중심·Solution 중심</b>의<br>컨설팅을 제공합니다.</p>
   <dl class="svc">${[["노동법률자문","각종 노동문제 상시 노무자문, 노동법률 검토 의견서"],["급여아웃소싱","근로계약서·임금체계·임금대장·4대보험 신고대행"],["노동사건대리","임금체불·대지급금·부당해고·직장 내 괴롭힘·성희롱"],["인사제도정비","장시간근로개선·평가제도·정년고용·일터혁신컨설팅"],["산재보험대리","최초요양·장해급여·유족급여·심사재심사 이의신청"],["손해사정지원","산재초과손해액 평가·근재·자동차·단체보험 손해사정"]].map(([k,x])=>`<div><dt>${k}</dt><dd>${x}</dd></div>`).join("")}</dl>
   ${[["부산","공인노무사·손해사정사","이진우","051-853-4421","01091144972","부산광역시 동구 중앙대로 282, 2층(초량동)"],["경남","공인노무사","신연옥","055-637-4421","01085508647","경상남도 거제시 거제중앙로 1930-10, 씨동 1207호(골든아트란티스)"]].map(([r,t,n,ph,mob,ad])=>`<div class="office"><div class="o-main"><div class="o-who"><b>${r}</b> <span>${t}</span> <b class="o-name">${n}</b></div><div class="o-tel">${ph}</div><div class="o-addr">${ad}</div></div><a class="o-call" href="tel:${mob}" aria-label="${n} 휴대폰으로 전화연결"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>전화연결</a></div>`).join("")}
   <div class="firm-foot"><div class="ff-name">청아노무법인</div><div class="ff-sub">매일 업데이트 · 2026 ©</div>
   <details class="disc"><summary>이용 안내 및 면책</summary><ol>
    <li>이 앱은 청아노무법인이 노동·사회보험 관련 기준금액, 요율, 지원금, 행정해석 등을 업무 참고용으로 정리해 제공하는 일반 정보입니다. 개별 사안에 대한 법률 자문이나 노무 상담을 대신하지 않습니다.</li>

function num(id){const el=document.getElementById(id);if(!el)return 0;const x=Number(String(el.value).replace(/[^0-9.\-]/g,""));return isNaN(x)?0:x;}

function bind(root,fn,key){root.querySelectorAll("input,select").forEach(el=>{
  const saved=store.get(key+"."+el.id,null);
  if(saved!=null){if(el.type==="checkbox")el.checked=saved;else el.value=saved;}
  el.addEventListener("input",()=>{if(el.classList.contains("money")){const p=el.selectionStart,ln=el.value.length;const raw=el.value.replace(/[^0-9]/g,"");el.value=raw?Number(raw).toLocaleString("ko-KR"):"";try{el.setSelectionRange(p+el.value.length-ln,p+el.value.length-ln)}catch(e){}}
    store.set(key+"."+el.id,el.type==="checkbox"?el.checked:el.value);fn();});
  el.addEventListener("change",fn);});fn();}

function prefCheck(p){const lim={mfg:500,g300:300,g200:200,etc:100}[p.ind]||100;const sz=p.size||"auto";if(sz==="sme")return {yes:true,lim,why:"중소기업기본법상 중소기업"};if(sz==="mid")return {yes:false,mid:true,lim};if(sz==="large")return {yes:false,lim};return {yes:p.emp<=lim,lim};}
function evalGrant(g,p){const r=g.rule||{};const why=[];let st="ok";
  if(r.closed)return {st:"no",why:["2026년 신규 지원 대상 아님"]};
  const pc=prefCheck(p);
  if(r.pref){if(pc.yes)why.push("우선지원대상기업 해당");else{st="no";why.push(`우선지원대상기업이 아님(업종 기준 ${pc.lim}인 초과). 중소기업기본법상 중소기업이면 재검토`);}}
  if(r.prefOrMid){if(pc.yes)why.push("우선지원대상기업 해당");else if(pc.mid)why.push("중견기업 해당");else{st="no";why.push("우선지원대상기업·중견기업이 아님");}}
  if(r.minEmp){if(p.emp<r.minEmp){st="no";why.push(`상시근로자 ${r.minEmp}인 이상 요건 불충족`);}else why.push(`상시근로자 ${r.minEmp}인 이상 충족`);}
  if(r.maxEmp){if(p.emp>=r.maxEmp){st="no";why.push(`상시근로자 ${r.maxEmp}인 미만 요건 불충족`);}else why.push(`상시근로자 ${r.maxEmp}인 미만 충족`);}
  if(r.minIns){if(p.ins<r.minIns){st="no";why.push(`피보험자 ${r.minIns}인 이상 요건 불충족${g.id==="youth"?"(특례업종은 1인 이상 가능)":""}`);}else why.push(`피보험자 ${r.minIns}인 이상 충족`);}
  if(r.needs&&r.needs.length){const miss=r.needs.filter(f=>!p.flags[f]);if(miss.length){if(st==="ok")st="maybe";why.push("해당 상황 미선택: "+miss.map(f=>(PROFILE_FLAGS.find(x=>x[0]===f)||[,f])[1]).join(", "));}else why.push("해당 상황 있음");}
  if(r.region==="youth")why.push(p.region==="metro"?"수도권형: 취업애로청년만 대상, 청년 근속인센티브 없음":"비수도권형: 취업애로 요건 없음, 청년 근속인센티브 별도 지급");
  if(r.region==="older")why.push(p.region==="metro"?"수도권 소재: 월 30만원":"비수도권 소재: 월 40만원");
  (r.check||[]).forEach(c=>why.push("확인: "+c));
  if(st==="ok"&&(r.check||[]).length)st="maybe";
  return {st,why};}

function interpMatch(x,toks){const hay=[x.title,x.q,x.a,x.no,x.basis,x.topic,...(x.orig||[]).map(o=>o.t)].join(" ").toLowerCase();return toks.every(g=>g.some(w=>hay.includes(w.toLowerCase())));}

function hl(text,toks){let t=esc(text);toks.flat().filter(w=>w.length>0).sort((a,b)=>b.length-a.length).forEach(w=>{const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");t=t.replace(re,"<mark>$1</mark>");});return t.replace(/<mark>(<mark>)+/g,"<mark>").replace(/(<\/mark>)+/g,"</mark>");}
function snippet(text,toks){const low=text.toLowerCase();let pos=-1;for(const g of toks)for(const w of g){const i=low.indexOf(w.toLowerCase());if(i>=0&&(pos<0||i<pos))pos=i;}const st=Math.max(0,pos-30);return (st>0?"…":"")+text.slice(st,st+120)+(text.length>st+120?"…":"");}
