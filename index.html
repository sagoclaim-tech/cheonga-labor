/* Layout: 모바일 우선 단일 컬럼 도구, 상단 기준일 바 + 하단 탭 바, 데스크톱에서는 중앙 760px 컬럼 */
:root{
  /* 청색 투톤: 짙은 남청(헤더·강조) + 밝은 청(포인트), 연청 바탕 */
  --paper:#eaf1f9; --surface:#ffffff; --sunk:#e1eaf5; --ink:#13233a; --muted:#56687f; --line:#ccd9e8;
  --accent:#12396e; --accent-2:#2c7be5; --accent-soft:#dbe8f8; --seal:#c0392b; --seal-soft:#f9e3e0;
  --hdr:#1a4c8c; --hdr-2:#1a4c8c; --hdr-fg:#ffffff;
  --ok:#1f7a4d; --ok-soft:#dcf0e5; --warn:#a0660a; --warn-soft:#f7ecd7; --no:#76839a; --no-soft:#e6ebf2;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0a1322; --surface:#111d31; --sunk:#0d182a; --ink:#e2eaf5; --muted:#93a6c0; --line:#22344f;
  --accent:#8fbaf0; --accent-2:#4d9bf0; --accent-soft:#16294a; --seal:#ef7468; --seal-soft:#3a1d1d;
  --hdr:#173f75; --hdr-2:#173f75; --hdr-fg:#ffffff;
  --ok:#62c48f; --ok-soft:#123222; --warn:#e6ae55; --warn-soft:#342812; --no:#8a9ab0; --no-soft:#1a263a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0a1322; --surface:#111d31; --sunk:#0d182a; --ink:#e2eaf5; --muted:#93a6c0; --line:#22344f;
  --accent:#8fbaf0; --accent-2:#4d9bf0; --accent-soft:#16294a; --seal:#ef7468; --seal-soft:#3a1d1d;
  --hdr:#173f75; --hdr-2:#173f75; --hdr-fg:#ffffff;
  --ok:#62c48f; --ok-soft:#123222; --warn:#e6ae55; --warn-soft:#342812; --no:#8a9ab0; --no-soft:#1a263a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;line-break:strict;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
a{color:var(--accent)}

/* 상단 바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdr-fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px}
.top-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px 16px}
.ctl{display:grid;justify-items:end;align-content:center;gap:6px}
@media (max-width:560px){.top-in{grid-template-columns:minmax(0,1fr)}.ctl{grid-template-columns:minmax(0,1fr);justify-items:start}.asof-note{justify-self:start}}
.asof button{white-space:nowrap}
.brand{font-family:var(--f-display);font-size:32px;letter-spacing:.04em;margin:0;line-height:1.2}
.brand small{display:block;font-family:var(--f-body);font-size:18px;font-weight:500;opacity:.9;letter-spacing:.02em;margin-top:4px}
.asof{display:flex;align-items:center;gap:6px;font-size:12px}
.asof input{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 8px;color:inherit;font-family:var(--f-num);font-size:13px}
.asof select{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 6px;color:inherit;font-size:13px;font-family:var(--f-num)}
.asof select option{color:#13233a;background:#fff}
.asof .nav-m{padding:4px 6px;display:inline-grid;place-items:center}
.asof .nav-m:disabled{opacity:.35;cursor:default}
.asof .nav-m svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.asof #today[aria-pressed="true"]{background:#fff;color:var(--hdr);font-weight:700}
.asof-note{text-align:right;white-space:nowrap;font-size:11px;opacity:.85;font-family:var(--f-num);justify-self:end}
.asof button{background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 8px;color:inherit;font-size:12px;cursor:pointer}

main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
.view{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.view>*{min-width:0}
#res,#all{grid-template-columns:minmax(0,1fr)}
h2{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0;font-weight:600}
.lede{color:var(--muted);font-size:13px;margin:4px 0 0}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* 요약 수치 */
.figs{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:620px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fgrp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;min-width:0;align-content:start}
details.fgrp>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
details.fgrp>summary::-webkit-details-marker{display:none}
.fgrp .ft{font-size:15px;font-weight:700;color:var(--accent)}
.fgrp .fk{grid-column:1;font-size:12.5px;color:var(--muted);font-family:var(--f-num);font-variant-numeric:tabular-nums}
.fgrp .chev{grid-column:2;grid-row:1/3;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .15s}
details.fgrp[open] .chev{transform:rotate(180deg)}
details.fgrp[open]>summary{margin-bottom:6px}
details.fgrp[open] .fk{display:none}
.calcbtns{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;margin-top:4px;border-top:1px solid var(--line)}
.calcbtn{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-2);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
.calcbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.fsub{font-size:11px;color:var(--muted);margin-bottom:2px}
.fgrp h3{font-size:13px;color:var(--accent);margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fgrp h3 small{font-weight:500;color:var(--muted);font-size:11px}
.frow{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;background:none;border:0;border-top:1px dashed var(--line);padding:8px 0 6px;text-align:left;cursor:pointer;width:100%}
.frow:first-of-type{border-top:0}
.frow .k{font-size:13px;color:var(--muted);white-space:nowrap}
.frow .v{justify-self:end;color:var(--accent);font-family:var(--f-num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.frow .s{grid-column:1/-1;justify-self:end;font-size:11px;color:var(--muted);text-align:right}
.frow .nx{color:var(--seal);font-weight:600}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:2px;min-width:0;cursor:pointer;text-align:left}
.fig .k{font-size:12px;color:var(--muted)}
.fig .v{color:var(--accent);font-family:var(--f-num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;word-break:keep-all}
.fig .s{font-size:11px;color:var(--muted)}
.fig .nx{font-size:11px;color:var(--seal);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panel>h3:first-child{color:var(--accent)}
h2{color:var(--accent)}
.list{display:grid;gap:0}
.row{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.date{font-family:var(--f-num);font-size:12px;color:var(--seal);font-weight:600;white-space:nowrap;padding-top:2px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.p-now{background:var(--accent-soft);color:var(--accent)}
.p-next{background:var(--seal-soft);color:var(--seal)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-no{background:var(--no-soft);color:var(--no)}

/* 계산기 */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.cmp2>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;background:var(--card)}.cmp2>div.on{border:2px solid var(--hdr,#1a4c8c)}.cmp2 span{font-size:12px;color:var(--muted)}.cmp2 b{font-size:17px}.cmp2 small{font-size:11px;color:var(--muted)}.asof-d{font-size:14px;color:var(--muted);margin-left:6px}.chips.wrap{flex-wrap:wrap;overflow:visible;row-gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;line-height:1.3;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .15s,border-color .15s}
.chip .cnt{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.chip[aria-pressed="true"] .cnt{color:rgba(255,255,255,.75)}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cgrid .chip{justify-content:center;white-space:normal;text-align:center;border-radius:10px;padding:9px 4px;font-size:12.5px;word-break:keep-all;min-height:40px}
@media (min-width:640px){.cgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.seg{display:flex;background:color-mix(in srgb,var(--line) 55%,transparent);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1 1 0;min-width:0;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;padding:7px 2px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25;word-break:keep-all}
.seg button .cnt{font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(19,35,58,.15)}
.sortbar{display:flex;align-items:center;justify-content:flex-end;gap:2px;font-size:12.5px;color:var(--muted)}
.sortbar span{margin-right:6px}
.sortbar button{border:0;background:transparent;font:inherit;color:var(--muted);padding:4px 8px;border-radius:6px;cursor:pointer}
.sortbar button[aria-pressed="true"]{color:var(--accent);font-weight:700;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.kw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kwl{width:100%;font-size:12px;color:var(--muted);margin-bottom:2px}
.kchip{border:0;background:color-mix(in srgb,var(--accent) 9%,transparent);color:var(--accent);border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form .full{grid-column:1/-1}
@media (max-width:420px){.form{grid-template-columns:1fr}}
.f{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0;align-content:start}
.lab{display:flex;align-items:center;gap:6px;justify-content:space-between}
.lab label{min-width:0}
.q{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--accent-2);background:var(--surface);color:var(--accent-2);font-size:12px;font-weight:700;line-height:1;cursor:pointer;display:inline-grid;place-items:center;padding:0}
.q[aria-expanded="true"]{background:var(--accent-2);color:#fff;border-color:var(--accent-2)}
.help{font-size:12px;line-height:1.55;color:var(--ink);background:var(--accent-soft);border-radius:8px;padding:8px 10px;white-space:pre-line}
.chkrow{display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13px}
.steps li b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.formula{font-family:var(--f-num);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
.rule{display:grid;gap:6px;font-size:13px}
.rule details{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.rule summary{cursor:pointer;padding:10px 12px;font-weight:600}
.rule .rb{padding:0 12px 12px;display:grid;gap:8px}
.rule ol,.rule ul{margin:0;padding-left:20px;display:grid;gap:6px}
.jn{font-family:var(--f-num);color:var(--accent);font-weight:600;margin-right:4px}
.f input,.f select{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;width:100%;min-width:0}
.f input[type=number],.f input.money{font-family:var(--f-num)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink)}
.chk input{margin-top:5px;accent-color:var(--accent)}
.result{background:var(--sunk);border-radius:8px;padding:12px;display:grid;gap:6px}
.big{font-family:var(--f-num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:minmax(7.5em,1fr) minmax(0,auto);gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted)}
.note b{color:var(--ink)}
.basis{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}

/* 표 */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--sunk);font-weight:600;font-size:12px;color:var(--muted)}
td.n{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}

/* 지원금 */
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.gcard>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;gap:4px}
.gcard>summary::-webkit-details-marker{display:none}
.ghead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gname{font-weight:600;font-size:15px}
.gamt{font-size:13px;color:var(--muted)}
.gbody{padding:0 16px 16px;display:grid;gap:10px}
.gbody dl{margin:0;display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:13px}
.gbody dt{color:var(--muted)}
.gbody dd{margin:0;min-width:0}
.why{font-size:12px;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.why li{margin:2px 0}
.why ul{margin:0;padding-left:18px}

.search{display:flex;gap:8px;position:relative}
.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
.search input{padding-left:38px!important;font-size:16px;border:2px solid var(--accent-2)!important;border-radius:12px!important}
.kw{display:flex;gap:6px;flex-wrap:wrap}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;text-align:left;cursor:pointer;width:100%;min-width:0}
.hit:hover{border-color:var(--accent-2)}
.hit .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hit .tt{font-weight:600}
.hit .sn{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.hit .val{font-family:var(--f-num);font-weight:600;color:var(--accent);white-space:nowrap}

<script>
(function(){
"use strict";
let D=null, ASOF=todayStr(), TAB="summary", CALC="mw", GFILTER="all", GOPEN=null;
const $=s=>document.querySelector(s);
const app=$("#app");
function todayStr(){const d=new Date(Date.now()+9*3600e3);return d.toISOString().slice(0,10);}
const won=n=>(n==null||isNaN(n))?"-":Math.round(n).toLocaleString("ko-KR")+"원";
const fmt=n=>(n==null||isNaN(n))?"-":Number(n).toLocaleString("ko-KR",{maximumFractionDigits:4});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem("cn."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("cn."+k,JSON.stringify(v))}catch(e){}}};

/* 기준 데이터 해석: 조회 기준일 이전 최신 값이 현행, 이후 값은 예정 */
function entry(id,date){const it=D.items[id];if(!it)return null;const h=[...it.hist].sort((a,b)=>a.from<b.from?-1:1);let cur=null;for(const e of h){if(e.from<=(date||ASOF))cur=e;}return cur;}
function nextEntry(id){const it=D.items[id];if(!it)return null;return [...it.hist].sort((a,b)=>a.from<b.from?-1:1).find(e=>e.from>ASOF)||null;}
function v(id){const e=entry(id);return e?e.value:null;}
function tbl(id){const t=D.tables[id];if(!t)return null;const vs=[...t.versions].sort((a,b)=>a.from<b.from?-1:1);let cur=null;for(const x of vs){if(x.from<=ASOF)cur=x;}return cur;}
function showVal(it,e){if(!e)return"-";if(typeof e.value==="number"){return it.unit==="원"?won(e.value):fmt(e.value)+(it.unit?(it.unit==="%"?"%":" "+it.unit):"");}return esc(e.value);}
/* 출처 허용 범위: 법제처, 정책브리핑, 고용노동부, 그 밖의 공공기관. 언론·민간 사이트 링크는 표시하지 않음 */
const OK_SRC=/^https?:\/\/([a-z0-9-]+\.)*(law\.go\.kr|lawmaking\.go\.kr|korea\.kr|moel\.go\.kr|work24\.go\.kr|ei\.go\.kr|comwel\.or\.kr|nhis\.or\.kr|nps\.or\.kr|kead\.or\.kr|bokjiro\.go\.kr|mohw\.go\.kr|minimumwage\.go\.kr|assembly\.go\.kr|4insure\.or\.kr|kosha\.or\.kr)([\/?#]|$)/i;
function okSrc(u){return OK_SRC.test(String(u||""));}
function noticeRow(n){return `<div class="row"><span class="date">${esc(n.date)}</span><div>${esc(n.text)}${okSrc(n.src)?` <a href="${esc(n.src)}" target="_blank" rel="noopener">${srcLabel(n.src)}</a>`:""}</div></div>`;}
/* 더 보기: 첫 lim건 표시 후 STEP건씩 단계별로 펼침. 각 단계 끝에 접기 버튼(누르면 처음 상태로) */
function moreRows(rows,lim,label){const STEP=10;if(!lim||rows.length<=lim)return rows.join("");
  const stage=rest=>{if(!rest.length)return "";const n=rest.length-STEP<=4?rest.length:STEP;
    return `<details class="more"><summary>${label} ${rest.length}건 더 보기</summary>${rest.slice(0,n).join("")}${stage(rest.slice(n))}<button type="button" class="fold">접기</button></details>`;};
  return rows.slice(0,lim).join("")+stage(rows.slice(lim));}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button.fold");if(!b)return;
  let top=b.closest("details.more");while(top&&top.parentElement&&top.parentElement.closest("details.more"))top=top.parentElement.closest("details.more");
  if(!top)return;top.querySelectorAll("details.more[open]").forEach(d=>d.open=false);top.open=false;
  const sm=top.querySelector(":scope>summary");if(sm&&sm.getBoundingClientRect().top<70)sm.scrollIntoView({block:"center"});});
function srcLabel(u){u=String(u||"");return /lawmaking\.go\.kr/.test(u)?"입법예고":/law\.go\.kr\/(행정규칙|%ED%96%89%EC%A0%95%EA%B7%9C%EC%B9%99)/i.test(u)?"고시 원문":/law\.go\.kr\/(법령별표서식|%EB%B2%95%EB%A0%B9%EB%B3%84%ED%91%9C)/i.test(u)?"별표 원문":/law\.go\.kr/.test(u)?"법령 원문":/likms\.assembly|assembly\.go\.kr/.test(u)?"국회 의안":/moel\.go\.kr/.test(u)?"고용노동부":/korea\.kr/.test(u)?"정책브리핑":"출처";}
function srcLine(ids){const out=[];for(const id of ids){const it=D.items[id],e=entry(id);if(!it||!e)continue;out.push(`${esc(it.name)}: ${esc(e.basis||"")}${okSrc(e.src)?` <a href="${esc(e.src)}" target="_blank" rel="noopener">출처</a>`:""} (확인 ${esc(e.checked||"")})`);}return out.length?`<div class="basis">※ 적용 기준(${esc(ASOF)}): ${out.join(" / ")}</div>`:"";}

/* 탭 */
/* 뒤로가기: 요약 외 탭에서 휴대폰 뒤로가기를 누르면 요약으로 돌아감 */
function showTab(t){TAB=t;try{const nm={summary:"요약",calc:"계산기",grants:"지원금",interp:"행정해석",search:"검색"}[t]||t;gtag("event","page_view",{page_title:""+nm,page_location:location.origin+location.pathname+"#"+t});}catch(e){}document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===t?"page":"false"));render();window.scrollTo(0,0);}
let NAVLOCK=false;
function navState(extra){return Object.assign({tab:TAB,calc:CALC,it:ITOPIC,ik:IKIND,gf:GFILTER,open:null,y:0},extra||{});}
function saveY(){try{history.replaceState(Object.assign({},history.state||{tab:TAB},{y:window.scrollY}),"",location.hash);}catch(e){}}
function pushNav(extra,noSave){if(NAVLOCK)return;if(!noSave)saveY();try{history.pushState(navState(extra),"","#"+TAB);}catch(e){}}
function cardKey(d){return d.dataset.iid?"i:"+d.dataset.iid:d.dataset.gid?"g:"+d.dataset.gid:d.dataset.gi!=null?"s:"+d.dataset.gi:null;}
function cardBy(k){if(!k)return null;const [t,v]=[k.slice(0,1),k.slice(2)];const a=t==="i"?"data-iid":t==="g"?"data-gid":"data-gi";return document.querySelector(`[${a}="${CSS.escape(v)}"]`);}
function setTab(t){if(t===TAB){showTab(t);return;}saveY();showTab(t);pushNav(null,true);}
window.addEventListener("popstate",e=>{const st=e.state||{tab:"summary"};NAVLOCK=true;
  const same=st.tab===TAB&&(st.calc||CALC)===CALC&&(st.it||ITOPIC)===ITOPIC&&(st.ik||IKIND)===IKIND&&(st.gf||GFILTER)===GFILTER;
  if(!same){if(st.calc)CALC=st.calc;if(st.it)ITOPIC=st.it;if(st.ik)IKIND=st.ik;if(st.gf)GFILTER=st.gf;showTab(st.tab||"summary");}
  document.querySelectorAll("details.gcard[open],details.fgrp[open]").forEach(d=>{if(cardKey(d)!==st.open)d.open=false;});
  if(st.open){const d=cardBy(st.open);if(d)d.open=true;}
  if(!same){const go=()=>{if(st.open){const d=cardBy(st.open);if(d&&!d.open)d.open=true;}window.scrollTo(0,st.y||0);};setTimeout(go,80);setTimeout(go,250);}
  setTimeout(()=>{NAVLOCK=false;},350);});
document.addEventListener("toggle",e=>{const d=e.target;if(NAVLOCK||!d.matches||!d.matches("details.gcard,details.fgrp"))return;const k=cardKey(d);if(!k)return;
  if(d.open){pushNav({open:k});}else{const st=history.state;if(st&&st.open===k){history.back();}}},true);
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
/* 조회 기준: 월 단위 선택(해당 월 1일 기준), 오늘 버튼은 현 시점 기준으로 데이터를 다시 불러옴 */
let MODE="today";
/* 조회 가능 시점: 과거는 2024·2025·2026년 1월, 그리고 현재 월. 미래 월은 두지 않음 */
const PAST_POINTS=["2024-01","2025-01","2026-01"],FUTURE_POINTS=["2027-01"];
function curYM(){return todayStr().slice(0,7);}
function monthOpts(){const c=curYM();return [...new Set([...PAST_POINTS.filter(v=>v<c),c,...FUTURE_POINTS.filter(v=>v>c)])];}
function isPast(){return MODE==="month"&&ASOF.slice(0,7)<curYM();}
function isFuture(){return MODE==="month"&&ASOF.slice(0,7)>curYM();}
function asofText(){return MODE==="today"?ASOF+" 현재":ASOF.slice(0,4)+"년 "+(+ASOF.slice(5,7))+"월 1일";}
function syncHeader(){const ym=ASOF.slice(0,7);const sel=$("#month");sel.value=MODE==="today"?curYM():ym;$("#mprev").disabled=sel.selectedIndex<=0;$("#mnext").disabled=sel.selectedIndex>=sel.options.length-1;
  $("#today").setAttribute("aria-pressed",MODE==="today"?"true":"false");$("#asofNote").textContent=MODE==="today"?"오늘("+ASOF+") 기준":ym.slice(0,4)+"년 "+(+ym.slice(5))+"월 1일 기준";}
function setMonth(ym){if(ym===curYM()){MODE="today";ASOF=todayStr();}else{MODE="month";ASOF=ym+"-01";}syncHeader();render();}
function shiftMonth(n){const o=monthOpts();let i=o.indexOf(MODE==="today"?curYM():ASOF.slice(0,7));if(i<0)i=o.length-1;i=Math.max(0,Math.min(o.length-1,i+n));setMonth(o[i]);}
let IV=null;
function loadInterp(){return fetch("interp.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.items))IV=j;}).catch(()=>{});}
function loadData(){return Promise.all([fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(j=>{D=j;}),loadInterp()]);}
$("#month").innerHTML=monthOpts().map(v=>`<option value="${v}">${v.slice(0,4)}년 ${+v.slice(5)}월${v===curYM()?" (현재)":v>curYM()?" (예정)":""}</option>`).join("");
$("#month").addEventListener("change",e=>setMonth(e.target.value));

function num(id){const el=document.getElementById(id);if(!el)return 0;const x=Number(String(el.value).replace(/[^0-9.\-]/g,""));return isNaN(x)?0:x;}
function sval(id){const el=document.getElementById(id);return el?el.value:"";}
function bind(root,fn,key){root.querySelectorAll("input,select").forEach(el=>{
  const saved=store.get(key+"."+el.id,null);
  if(saved!=null){if(el.type==="checkbox")el.checked=saved;else el.value=saved;}
  el.addEventListener("input",()=>{if(el.classList.contains("money")){const p=el.selectionStart,ln=el.value.length;const raw=el.value.replace(/[^0-9]/g,"");el.value=raw?Number(raw).toLocaleString("ko-KR"):"";try{el.setSelectionRange(p+el.value.length-ln,p+el.value.length-ln)}catch(e){}}
    store.set(key+"."+el.id,el.type==="checkbox"?el.checked:el.value);fn();});
  el.addEventListener("change",fn);});fn();}

function mwMonthHours(wk){const hol=wk<15?0:Math.min(8,wk/40*8);return {hol,exact:(wk+hol)*365/7/12,h:Math.round((wk+hol)*365/7/12)};}

function cAL(root){
  const y=+ASOF.slice(0,4);
  root.innerHTML=`<div class="panel"><h3>연차유급휴가 일수</h3>
  <div class="form">${field("al_basis","부여 기준","join","select",{opts:[["join","입사일 기준"],["fiscal","회계연도 기준"]]})}${field("al_fm","회계연도 시작 월",1,"select",{opts:Array.from({length:12},(_,i)=>[i+1,(i+1)+"월 1일"])})}

    const rate80=sval("al_rate")==="1";const under1=yrs<1;
    $("#al_full").closest(".f").style.display=(under1||!rate80)?"":"none";$("#al_rate").closest(".f").style.display=under1?"none":"";
    const full=Math.max(0,Math.floor(num("al_full")));

      jTxt=rate80?`근속 ${yrs}년: 15일${annual(yrs)>15?" + 가산 "+(annual(yrs)-15)+"일":""}(제60조 제1항, 제4항, 최대 25일)`:`직전 1년 출근율 80% 미만: 개근한 ${Math.min(full,11)}개월에 1일씩(제60조 제2항), 가산휴가 없음`;

    // 회계연도 기준
    const fm=+sval("al_fm")||1;let S=new Date(a.getFullYear(),fm-1,1);if(S<a)S.setFullYear(S.getFullYear()+1);
    const partial=S>a;const pDays=Math.round((S-a)/864e5);const prop=Math.round(15*pDays/365*100)/100;
    const rows=[];if(partial)rows.push({d:new Date(S),days:prop,k:`비례 부여(15일 x ${pDays}/365)`});

    ${b<addM(a,12)?`<dt>입사 1년 미만 월 단위 연차(별도)</dt><dd>${monthly}일(개근 1개월마다 1일, 최대 11일)</dd>`:""}
    ${nxt?`<dt>다음 발생일</dt><dd>${kd(nxt.d)}(${fmt(nxt.days)}일)</dd>`:""}

    <p class="note">※ 회계연도 기준은 취업규칙이나 단체협약으로 정해 운영할 수 있으며, 연도 중 입사자에게는 다음 해에 입사 연도 근속기간에 비례해 휴가를 주고 이후 회계연도 기준으로 부여합니다. 퇴직 시 총 휴가일수가 입사일 기준보다 적으면 부족분을 연차휴가수당으로 정산해야 한다는 것이 고용노동부 입장입니다(고용노동부 연차유급휴가 질의회신). 비례 일수의 소수점 처리(올림 부여 또는 수당 정산)는 사업장 규정에 따릅니다. 가산휴가는 정기 부여 3회차부터 2회차마다 1일씩 더하는 일반적인 운영 방식으로 계산했습니다.</p>`},"al");}

const PROFILE_FLAGS=[["parental","육아휴직·육아기 근로시간 단축 사용(예정)자 있음"],["youth","청년(15~34세) 정규직 신규채용 계획"],["older","정년 도래자 계속고용(정년연장·폐지·재고용) 검토"],["older60","60세 이상 근로자 고용 증가 계획"],["disabled","장애인 근로자 고용 중"],["downturn","경영 악화로 휴업·휴직 검토"],["hours","근로시간 단축 희망 근로자 있음"],["vuln","취업취약계층(취업지원제도 이수자 등) 채용 계획"],["lowpay","월 보수 기준액 미만 신규 근로자 있음"]];
const INDUSTRY=[["mfg","제조업"],["g300","광업·건설·운수창고·정보통신·사업시설관리·전문과학기술·보건복지 등(300인)"],["g200","도소매·숙박음식·금융보험·예술스포츠(200인)"],["etc","그 밖의 업종(100인)"]];
function prefCheck(p){const lim={mfg:500,g300:300,g200:200,etc:100}[p.ind]||100;const sz=p.size||"auto";if(sz==="sme")return {yes:true,lim,why:"중소기업기본법상 중소기업"};if(sz==="mid")return {yes:false,mid:true,lim};if(sz==="large")return {yes:false,lim};return {yes:p.emp<=lim,lim};}
function evalGrant(g,p){const r=g.rule||{};const why=[];let st="ok";
  if(r.closed)return {st:"no",why:["2026년 신규 지원 대상 아님"]};
  const pc=prefCheck(p);
  if(r.pref){if(pc.yes)why.push("우선지원대상기업 해당");else{st="no";why.push(`우선지원대상기업이 아님(업종 기준 ${pc.lim}인 초과). 중소기업기본법상 중소기업이면 재검토`);}}
  if(r.prefOrMid){if(pc.yes)why.push("우선지원대상기업 해당");else if(pc.mid)why.push("중견기업 해당");else{st="no";why.push("우선지원대상기업·중견기업이 아님");}}
  if(r.minEmp){if(p.emp<r.minEmp){st="no";why.push(`상시근로자 ${r.minEmp}인 이상 요건 불충족`);}else why.push(`상시근로자 ${r.minEmp}인 이상 충족`);}
  if(r.maxEmp){if(p.emp>=r.maxEmp){st="no";why.push(`상시근로자 ${r.maxEmp}인 미만 요건 불충족`);}else why.push(`상시근로자 ${r.maxEmp}인 미만 충족`);}
  if(r.minIns){if(p.ins<r.minIns){st="no";why.push(`피보험자 ${r.minIns}인 이상 요건 불충족${g.id==="youth"?"(특례업종은 1인 이상 가능)":""}`);}else why.push(`피보험자 ${r.minIns}인 이상 충족`);}
  if(r.needs&&r.needs.length){const miss=r.needs.filter(f=>!p.flags[f]);if(miss.length){if(st==="ok")st="maybe";why.push("해당 상황 미선택: "+miss.map(f=>(PROFILE_FLAGS.find(x=>x[0]===f)||[,f])[1]).join(", "));}else why.push("해당 상황 있음");}
  if(r.region==="youth")why.push(p.region==="metro"?"수도권형: 취업애로청년만 대상, 청년 근속인센티브 없음":"비수도권형: 취업애로 요건 없음, 청년 근속인센티브 별도 지급");
  if(r.region==="older")why.push(p.region==="metro"?"수도권 소재: 월 30만원":"비수도권 소재: 월 40만원");
  (r.check||[]).forEach(c=>why.push("확인: "+c));
  if(st==="ok"&&(r.check||[]).length)st="maybe";
  return {st,why};}
function rGrants(){

  <div style="display:grid;gap:10px">${shown.map(({g,e})=>`<details class="gcard" data-gid="${esc(g.id)}"><summary><div class="ghead"><span class="pill ${lab[e.st][1]}">${lab[e.st][0]}</span><span class="note">${esc(g.family||"")}</span></div><span class="gname">${esc(g.name)}</span><span class="gamt">${esc(g.headline||"")}</span></summary>
   <div class="gbody"><div class="why"><ul>${e.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>

   <div class="basis">${okSrc(g.src)?`<a href="${esc(g.src)}" target="_blank" rel="noopener">출처 원문</a> · `:""}확인 ${esc(g.checked||"")}</div></div></details>`).join("")||`<p class="note">해당하는 지원금이 없습니다.</p>`}</div>
  <p class="foot">※ 지원금은 연도별 사업운영지침과 예산 소진 여부에 따라 달라집니다. 신청 전 고용24 공고로 최종 확인합니다.</p></section>`;
  app.querySelectorAll("[data-gf]").forEach(b=>b.addEventListener("click",()=>{saveY();GFILTER=b.dataset.gf;rGrants();pushNav(null,true);}));

let ITOPIC="전체",ISORT="recent",IOPEN=null,IKIND="all";
const ITOPICS=["최저임금","임금","퇴직금","연차휴가","근로시간","실업급여","모성보호","지원금","대지급금","산재보상","사회보험","기타"];
const KOF=x=>x.kind==="civil"?"civil":x.kind==="moleg"?"moleg":"interp";
function secName(h,x){h=String(h||"").trim();if(x.kind==="moleg")return h;if(h==="질의요지"||h==="질의")return x.kind==="civil"?"민원 내용":"질의";if(h==="회답"||h==="회시")return x.kind==="civil"?"답변":"회시";return h;}
function interpMatch(x,toks){const hay=[x.title,x.q,x.a,x.no,x.basis,x.topic,...(x.orig||[]).map(o=>o.t)].join(" ").toLowerCase();return toks.every(g=>g.some(w=>hay.includes(w.toLowerCase())));}
function rInterp(){

  app.innerHTML=`<section class="view"><div><span class="eyebrow">고용노동부 질의회시${IV&&IV.meta&&IV.meta.updated?" · 최종 갱신 "+esc(IV.meta.updated):""}</span><h2>행정해석</h2>
  <p class="lede">금전 기준과 관련된 고용노동부 질의회시, 법제처 법령해석, 최근 국민신문고 민원 답변을 분야별로 모았습니다. 평일 아침마다 새로 나온 회시를 확인해 추가합니다. 항목을 누르면 질의와 회시 원문이 바로 보입니다.</p></div>
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="iq" type="search" placeholder="예: 연차수당 퇴직, 통상임금 상여금" value="${esc(q)}" autocomplete="off"></div>

  ${hasViews?`<div class="sortbar"><span>정렬</span><button type="button" data-is="recent" aria-pressed="${ISORT==="recent"}">최신순</button><button type="button" data-is="views" aria-pressed="${ISORT==="views"}">조회순</button></div>`:""}
  <div id="ilist" style="display:grid;gap:10px"></div>
  <p class="foot">※ 행정해석은 행정기관의 법령 해석으로 법원을 기속하지 않습니다. 구체적 사안은 회시 원문과 최신 판례로 확인합니다.</p></section>`;
  const draw=()=>{const s=sval("iq").trim();store.set("iq",s);const toks=s?s.toLowerCase().split(/\s+/).filter(Boolean).map(expand):[];

    list.sort(ISORT==="views"?(a,b)=>(b.views||0)-(a.views||0)||(a.date<b.date?1:-1):(a,b)=>a.date<b.date?1:a.date>b.date?-1:0);

  $("#iq").addEventListener("input",draw);

const SYN=[["실업급여","구직급여","실업"],["대지급금","체당금"],["장례비","장의비"],["산재","산업재해","재해"],["육아휴직","육휴"],["최저임금","최저시급","최임"],["건강보험","건보"],["국민연금","연금보험"],["장기요양","요양보험"],["고용보험","고보"],["지원금","장려금","보조금"],["출산휴가","출산전후휴가"],["두루누리","사회보험료 지원"],["괴롭힘","갑질"],["질병","부상","질환"],["퇴직금","퇴직급여"],["연차","연차휴가"],["4대보험","사대보험"],["고령자","고령","정년"],["청년","청년도약"],["장애인","장애"],["휴업급여","휴업"],["상한","상한액","최고"],["하한","하한액","최저"]];
function expand(tok){const out=new Set([tok]);SYN.forEach(g=>{if(g.some(w=>w.includes(tok)||tok.includes(w)))g.forEach(w=>out.add(w));});return [...out];}
let DOCS=null;
function buildDocs(){const docs=[];const add=(type,title,text,go,val)=>docs.push({type,title,text:String(text||""),go,val,hay:(type+" "+title+" "+(text||"")).toLowerCase()});
  for(const [id,it] of Object.entries(D.items)){const cur=entry(id);const others=[...it.hist].sort((a,b)=>a.from<b.from?1:-1).filter(h=>h!==cur);

  [["mw","최저임금 계산기","최저임금 위반 산입범위 월 환산 209시간 수습 감액 포괄임금 고정연장 역산 단시간 주휴 미달 차액 체불 소멸시효 내년 인상"],["ui","실업급여 계산기","구직급여 일액 상한 하한 소정급여일수 수급요건 이직사유"],["pl","육아휴직급여 계산기","육아휴직 6+6 통상임금 상한"],["mat","출산전후휴가급여 계산기","출산휴가 다태아 미숙아 우선지원대상기업 상한"],["ins","4대보험료 계산기","국민연금 건강보험 장기요양 고용보험 산재보험 요율 보험료"],["sev","퇴직금 계산기","퇴직금 평균임금 상여금 연차수당 계속근로"],["al","연차일수 계산기","연차유급휴가 출근율 가산휴가"],["dg","대지급금 계산기","체당금 도산 간이 상한"],["sp","배우자 출산전후휴가급여 계산기","배우자 출산전후휴가 배우자 출산휴가 20일 남편 아빠 출산 출산예정일 50일 전 급여 우선지원대상기업 배우자 유산 사산휴가"],["dis","장애인 고용 계산기","장애인 의무고용 부담금 부담기초액 고용장려금 중증 2배"]].forEach(([c,t,k])=>add("계산기",t,k,{calc:c}));

function hl(text,toks){let t=esc(text);toks.flat().filter(w=>w.length>0).sort((a,b)=>b.length-a.length).forEach(w=>{const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");t=t.replace(re,"<mark>$1</mark>");});return t.replace(/<mark>(<mark>)+/g,"<mark>").replace(/(<\/mark>)+/g,"</mark>");}
function snippet(text,toks){const low=text.toLowerCase();let pos=-1;for(const g of toks)for(const w of g){const i=low.indexOf(w.toLowerCase());if(i>=0&&(pos<0||i<pos))pos=i;}const st=Math.max(0,pos-30);return (st>0?"…":"")+text.slice(st,st+120)+(text.length>st+120?"…":"");}
function itemDetail(id){const it=D.items[id];const e=entry(id),n=nextEntry(id);const hist=[...it.hist].sort((a,b)=>a.from<b.from?1:-1);
  return `<div class="hitdetail"><div class="ghead">${e?`<span class="pill p-now">${esc(e.from)} 시행</span>`:""}${n?`<span class="pill p-next">${esc(n.from)} 예정: ${showVal(it,n)}</span>`:""}</div>
  ${e?`<div class="meta">근거: ${esc(e.basis||"")} · 확인 ${esc(e.checked||"")}${okSrc(e.src)?` · <a href="${esc(e.src)}" target="_blank" rel="noopener">출처</a>`:""}</div>`:""}
  ${e&&e.note?`<div class="note">※ ${esc(e.note)}</div>`:""}${hist.length>1?`<div class="hist">이력: ${hist.map(h=>`${esc(h.from)} ${showVal(it,h)}`).join(" / ")}</div>`:""}</div>`;}
function goDoc(d){const g=d.go;
  if(g.interp){ITOPIC="전체";IOPEN=g.interp;store.set("iq","");setTab("interp");return;}
  if(g.grant){GFILTER="all";GOPEN=g.grant;setTab("grants");return;}
  if(g.calc){CALC=g.calc;if(g.just){store.set("ui.ui_reason","just");store.set("ui.ui_just",g.just);}if(g.kind)store.set("sj.sj_kind",g.kind);setTab("calc");return;}
  if(g.notice&&okSrc(g.notice)){window.open(g.notice,"_blank","noopener");}}
function rSearch(){
  if(!DOCS||DOCS._d!==D||DOCS._a!==ASOF||DOCS._i!==IV){DOCS=buildDocs();DOCS._d=D;DOCS._a=ASOF;DOCS._i=IV;}
  const q=store.get("q","");

  app.innerHTML=`<section class="view"><div><span class="eyebrow">${esc(asofText())} 기준</span><h2>통합 검색</h2><p class="lede">기준 수치, 지원금, 실업급여 이직사유, 산재 급여표, 계산기, 제도 동향을 한 번에 찾습니다. 띄어 쓴 단어는 모두 포함된 결과만 보여 주며, 장의비와 장례비처럼 같은 뜻의 단어도 함께 찾습니다.</p></div>
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" type="search" placeholder="예: 질병 퇴사, 대체인력, 장해 7급" value="${esc(q)}" autocomplete="off"></div>
  <div class="kw"><span class="kwl">자주 찾는 검색어</span>${KW.map(k=>`<button type="button" class="kchip" data-kw="${esc(k)}">${esc(k)}</button>`).join("")}</div>
  <div id="res" style="display:grid;gap:10px"></div>
  <div id="all" style="display:grid;gap:14px"></div></section>`;
  const draw=()=>{const s=sval("q").trim();store.set("q",s);
    if(!s){$("#res").innerHTML="";drawAll();return;}$("#all").innerHTML="";
    const toks=s.toLowerCase().split(/\s+/).filter(Boolean).map(expand);
    const hits=DOCS.map(d=>{let score=0;for(const g of toks){let best=0;for(const w of g){const lw=w.toLowerCase();if(d.title.toLowerCase().includes(lw))best=Math.max(best,3);else if(d.hay.includes(lw))best=Math.max(best,1);}if(!best)return null;score+=best;}return {d,score};}).filter(Boolean).sort((a,b)=>b.score-a.score);
    $("#res").innerHTML=`<p class="note">검색 결과 ${hits.length}건</p>`+(hits.map((h,i)=>{const d=h.d;const it=d.go.item?D.items[d.go.item]:null;const val=it?showVal(it,entry(d.go.item)):"";
      return `<div class="hit" data-i="${i}" role="button" tabindex="0"><div class="t"><span class="tt">${hl(d.title,toks)}</span>${val?`<span class="val">${val}</span>`:""}</div>
      <div class="ghead"><span class="pill p-type">${esc(d.type)}</span>${d.go.interp?'<span class="note">눌러서 행정해석으로 이동</span>':d.go.calc?'<span class="note">눌러서 계산기로 이동</span>':d.go.grant?'<span class="note">눌러서 지원금 상세로 이동</span>':d.go.notice?'<span class="note">눌러서 출처 열기</span>':'<span class="note">눌러서 근거 보기</span>'}</div>
      <div class="sn">${hl(snippet(d.text,toks),toks)}</div><div class="dx"></div></div>`;}).join("")||`<p class="note">찾는 내용이 없습니다. 다른 표현으로 검색하거나 단어 수를 줄여 보세요.</p>`);
    $("#res").querySelectorAll(".hit").forEach(el=>{const act=()=>{const d=hits[+el.dataset.i].d;if(d.go.item){const dx=el.querySelector(".dx");dx.innerHTML=dx.innerHTML?"":itemDetail(d.go.item);}else goDoc(d);};
      el.addEventListener("click",e=>{if(e.target.closest("a"))return;act();});el.addEventListener("keydown",e=>{if(e.key==="Enter")act();});});};
  const drawAll=()=>{const groups={};for(const [id,it] of Object.entries(D.items)){(groups[it.group]=groups[it.group]||[]).push([id,it]);}
    $("#all").innerHTML=`<h3 style="margin-top:6px">전체 기준표</h3>`+Object.entries(groups).map(([g,arr])=>`<div class="panel"><h3>${esc(g)}</h3><div class="list">${arr.map(([id,it])=>`<div class="item"><div class="t"><b>${esc(it.name)}</b><span class="val">${showVal(it,entry(id))}</span></div>${itemDetail(id).replace('class="hitdetail"','class=""')}</div>`).join("")}</div></div>`).join("");};
  $("#q").addEventListener("input",draw);
  app.querySelectorAll("[data-kw]").forEach(b=>b.addEventListener("click",()=>{$("#q").value=b.dataset.kw;draw();}));
  draw();
}
